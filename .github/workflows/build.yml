name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for zip
        run: |
          ls -la
          if [ ! -f skyline-hotel-game.zip ]; then
            echo "skyline-hotel-game.zip is missing!"
            exit 1
          fi

      - name: Unzip game
        run: |
          rm -rf www temp
          unzip -o skyline-hotel-game.zip -d temp
          if [ -d temp/www ]; then
            mv temp/www ./www
          else
            mkdir -p www
            cp -r temp/* www/ || true
          fi
          echo "=== www contents ==="
          find www -type f
          test -f www/index.html && echo "index.html found"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (manual)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create Capacitor files
        run: |
          cat > package.json << 'EOP'
          {
            "name": "skyline-hotel",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/core": "6.1.2",
              "@capacitor/cli": "6.1.2"
            }
          }
          EOP

          cat > capacitor.config.json << 'EOC'
          {
            "appId": "com.skyline.hotel",
            "appName": "Skyline Hotel",
            "webDir": "www"
          }
          EOC

      - name: Install and sync
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkylineHotel-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
